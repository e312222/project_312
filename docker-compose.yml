services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tsg
      POSTGRES_PASSWORD: tsg
      POSTGRES_DB: tsg
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tsg -d tsg"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://tsg:tsg@db:5432/tsg
      MOCK_PAYMENT_BASE_URL: http://localhost/support/mock-pay
      CORS_ORIGINS: http://localhost,http://127.0.0.1
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: /api/v1
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata: