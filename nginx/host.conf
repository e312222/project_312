# Nginx на хосте, не в контейнере.
#
# Эти location нужно вставить в ТОТ ЖЕ server { }, который уже
# отдаёт сайт по HTTP и по HTTPS (порт 443). Если certbot сделал
# отдельный SSL-блок — скопируйте location и туда, иначе /tsg/
# откроется, а /tsg/api/ уйдёт не туда или будет висеть.
#
# Фронт: 127.0.0.1:3180, API: 127.0.0.1:8310.

upstream tsg_frontend {
    server 127.0.0.1:3180;
}

upstream tsg_backend {
    server 127.0.0.1:8310;
}

server {
    listen 80;
    server_name тсжнабережная.рф www.тсжнабережная.рф xn--80abdkakqodr2b6a9gsa.xn--p1ai;

    client_max_body_size 10m;

    # ^~ — не отдавать эти URL другим regexp-location (php, ~* \.(js|css|ico|…)$).
    # Без ^~ у /tsg/ HTML открывается, а .js/.css/.ico уходят в чужой upstream → 502 и белый экран.
    location ^~ /tsg/api/ {
        proxy_pass http://tsg_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location = /tsg {
        return 301 /tsg/;
    }

    location ^~ /tsg/ {
        proxy_pass http://tsg_frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
