# Nginx на хосте, не в контейнере.
# Фронт: 127.0.0.1:3180, API: 127.0.0.1:8310.
# Скопировать в /etc/nginx/sites-available/tsg.conf и включить сайт.

upstream tsg_frontend {
    server 127.0.0.1:3180;
}

upstream tsg_backend {
    server 127.0.0.1:8310;
}

server {
    listen 80;
    server_name тсжнабережная.рф www.тсжнабережная.рф xn--80abdkakqodr2b6a9gsa.xn--p1ai;

    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://tsg_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://tsg_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
